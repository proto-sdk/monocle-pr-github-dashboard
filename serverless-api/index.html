<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monocle PR Dashboard API</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #FF6B35;
            --hover-color: #FF8C42;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .info-card {
            background-color: var(--secondary-color);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 2rem;
            margin: 2rem 0;
        }
        
        .endpoint {
            background-color: var(--primary-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: monospace;
            word-break: break-all;
        }
        
        .status {
            display: inline-block;
            padding: 0.25rem 1rem;
            background-color: #2ea44f;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        .footer {
            margin-top: 2rem;
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        a:hover {
            color: var(--hover-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Monocle PR Dashboard API</h1>
        
        <div class="info-card">
            <h2>API Proxy Service</h2>
            <p>This serverless function proxies requests to the GitHub API with authentication.</p>
            
            <div class="endpoint">
                <strong>Base URL:</strong><br>
                <span id="baseUrl"></span>
            </div>
            
            <div class="endpoint">
                <strong>Example Endpoint:</strong><br>
                /api/github/repos/btc-mining/miner-firmware/pulls
            </div>
            
            <div class="status">✅ Service Active</div>
        </div>
        
        <div class="footer">
            <p>Part of the <a href="/sites/monocle-pr-dashboard/">Monocle PR Dashboard</a></p>
            <p>Powered by Blockcell</p>
        </div>
    </div>
    
    <script>
        // Display the current base URL
        document.getElementById('baseUrl').textContent = window.location.origin;
        
        // Test the API endpoint
        fetch('/api/github/rate_limit')
            .then(res => res.json())
            .then(data => {
                console.log('API Rate Limit:', data);
            })
            .catch(err => {
                console.error('API test failed:', err);
            });
    </script>
</body>
</html>

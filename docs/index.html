<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monocle PR GitHub Dashboard</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #FF6B35;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --background: #0d0d0d;
            --card-background: #1a1a1a;
            --border-color: #2a2a2a;
            --success-color: #4CAF50;
            --error-color: #f44336;
            --merged-color: #9C27B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-color), #FF8C42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-description {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .header-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .version, .pr-count {
            background: var(--background);
            border: 1px solid var(--accent-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            color: var(--accent-color);
        }

        .controls-section {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .filter-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-section label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .filter-section select,
        .filter-section input {
            padding: 8px 12px;
            background: var(--background);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .filter-section select:hover,
        .filter-section input:hover,
        .filter-section select:focus,
        .filter-section input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .stats-section {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--background);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .stat-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .stat-dot.open { background: var(--success-color); }
        .stat-dot.closed { background: var(--error-color); }
        .stat-dot.merged { background: var(--merged-color); }

        .pr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .pr-card {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .pr-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.1);
        }

        .pr-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .pr-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            flex: 1;
            margin-right: 10px;
        }

        .pr-title:hover {
            color: var(--accent-color);
        }

        .pr-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
        }

        .pr-status.open { background: var(--success-color); }
        .pr-status.closed { background: var(--error-color); }
        .pr-status.merged { background: var(--merged-color); }

        .pr-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .pr-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pr-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .label {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            background: var(--background);
            border: 1px solid var(--border-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .no-pat-warning {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--accent-color);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .no-pat-warning h3 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .no-pat-warning p {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Monocle PR GitHub Dashboard</h1>
            <div class="header-description">Real-time GitHub Pull Request tracking for btc-mining repository</div>
            <div class="header-info">
                <span class="version">v2.0.0</span>
                <span class="pr-count" id="prCount">Loading PRs...</span>
            </div>
        </div>

        <div class="controls-section">
            <div class="filter-section">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="all">All PRs</option>
                    <option value="open">Open</option>
                    <option value="closed">Closed</option>
                    <option value="merged">Merged</option>
                </select>

                <label for="authorFilter">Author:</label>
                <input type="text" id="authorFilter" placeholder="Filter by author...">

                <label for="searchFilter">Search:</label>
                <input type="text" id="searchFilter" placeholder="Search PRs...">
            </div>

            <div class="stats-section" id="statsSection">
                <!-- Stats will be populated here -->
            </div>
        </div>

        <div id="prContainer" class="pr-grid"></div>
    </div>

    <script>
        // GitHub API configuration
        const GITHUB_API = 'https://api.github.com';
        const REPO = 'btc-mining/btc-mining';
        
        let allPRs = [];

        async function fetchPRs() {
            const container = document.getElementById('prContainer');
            container.innerHTML = '<div class="loading">Loading pull requests...</div>';

            try {
                // Fetch PRs without authentication (rate limited to 60 requests/hour)
                const response = await fetch(`${GITHUB_API}/repos/${REPO}/pulls?state=all&per_page=100`);
                
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('GitHub API rate limit exceeded. Please try again later.');
                    }
                    throw new Error(`API Error: ${response.status}`);
                }

                allPRs = await response.json();
                
                // Check for merged PRs
                for (let pr of allPRs) {
                    if (pr.state === 'closed' && pr.merged_at) {
                        pr.state = 'merged';
                    }
                }

                updateStats();
                filterPRs();
                document.getElementById('prCount').textContent = `${allPRs.length} Total PRs`;
            } catch (error) {
                container.innerHTML = `
                    <div class="no-pat-warning">
                        <h3>⚠️ Limited API Access</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px;">
                            GitHub's public API is limited to 60 requests per hour without authentication.
                            <br>For unlimited access, please use the local version of this dashboard.
                        </p>
                    </div>
                `;
                console.error('Error:', error);
            }
        }

        function updateStats() {
            const stats = {
                open: allPRs.filter(pr => pr.state === 'open').length,
                closed: allPRs.filter(pr => pr.state === 'closed').length,
                merged: allPRs.filter(pr => pr.state === 'merged').length
            };

            const total = stats.open + stats.closed + stats.merged || 1;
            const statsHTML = `
                <div class="stat-item">
                    <span class="stat-dot open"></span>
                    <span>Open: ${stats.open} (${((stats.open/total)*100).toFixed(1)}%)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-dot closed"></span>
                    <span>Closed: ${stats.closed} (${((stats.closed/total)*100).toFixed(1)}%)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-dot merged"></span>
                    <span>Merged: ${stats.merged} (${((stats.merged/total)*100).toFixed(1)}%)</span>
                </div>
            `;
            document.getElementById('statsSection').innerHTML = statsHTML;
        }

        function filterPRs() {
            const statusFilter = document.getElementById('statusFilter').value;
            const authorFilter = document.getElementById('authorFilter').value.toLowerCase();
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();

            let filtered = allPRs;

            if (statusFilter !== 'all') {
                filtered = filtered.filter(pr => pr.state === statusFilter);
            }

            if (authorFilter) {
                filtered = filtered.filter(pr => 
                    pr.user.login.toLowerCase().includes(authorFilter)
                );
            }

            if (searchFilter) {
                filtered = filtered.filter(pr => 
                    pr.title.toLowerCase().includes(searchFilter) ||
                    pr.body?.toLowerCase().includes(searchFilter) ||
                    pr.number.toString().includes(searchFilter)
                );
            }

            displayPRs(filtered);
        }

        function displayPRs(prs) {
            const container = document.getElementById('prContainer');
            
            if (prs.length === 0) {
                container.innerHTML = '<div class="error">No pull requests found matching filters</div>';
                return;
            }

            const prHTML = prs.map(pr => `
                <div class="pr-card" onclick="window.open('${pr.html_url}', '_blank')">
                    <div class="pr-header">
                        <a href="${pr.html_url}" target="_blank" class="pr-title" onclick="event.stopPropagation()">
                            #${pr.number} - ${pr.title}
                        </a>
                        <span class="pr-status ${pr.state}">${pr.state}</span>
                    </div>
                    <div class="pr-meta">
                        <div class="pr-meta-item">
                            👤 ${pr.user.login}
                        </div>
                        <div class="pr-meta-item">
                            📅 ${new Date(pr.created_at).toLocaleDateString()}
                        </div>
                        <div class="pr-meta-item">
                            💬 ${pr.comments} comments
                        </div>
                        ${pr.draft ? '<div class="pr-meta-item">📝 Draft</div>' : ''}
                    </div>
                    ${pr.labels.length > 0 ? `
                        <div class="pr-labels">
                            ${pr.labels.map(label => 
                                `<span class="label" style="background-color: #${label.color}22; color: #${label.color}">${label.name}</span>`
                            ).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            container.innerHTML = prHTML;
        }

        // Event listeners
        document.getElementById('statusFilter').addEventListener('change', filterPRs);
        document.getElementById('authorFilter').addEventListener('input', filterPRs);
        document.getElementById('searchFilter').addEventListener('input', filterPRs);

        // Initialize
        fetchPRs();
        
        // Auto-refresh every 5 minutes
        setInterval(fetchPRs, 5 * 60 * 1000);
    </script>
</body>
</html>

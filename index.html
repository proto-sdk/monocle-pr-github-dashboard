<!DOCTYPE html>
<html>
<head>
    <title>Monocle PR Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #FF6B35;
            --hover-color: #FF8C42;
            --border-color: #444;
            --success-color: #2ea44f;
            --danger-color: #cb2431;
            --merged-color: #6f42c1;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-color);
            color: var(--text-color);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header section with Proto API docs styling */
        .header {
            background-color: var(--secondary-color);
            padding: 2rem;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            margin: 0 -20px 2rem -20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--text-color);
        }
        
        .header-description {
            margin: 1rem 0;
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .header-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .version {
            display: inline-block;
            background-color: var(--accent-color);
            padding: 0.25rem 1rem;
            border-radius: 20px;
            font-size: 1rem;
        }
        
        /* Controls section */
        .controls-section {
            background-color: var(--secondary-color);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .token-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            background-color: var(--primary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }
        
        .token-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .refresh-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.3s;
        }
        
        .refresh-button:hover {
            background-color: var(--hover-color);
        }
        
        .refresh-button.refreshing {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        #refresh-timer {
            font-family: monospace;
            color: var(--accent-color);
            font-weight: 600;
            padding: 8px 12px;
            background-color: var(--primary-color);
            border-radius: 6px;
        }
        
        /* Filter section */
        .filter-section {
            background-color: var(--secondary-color);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            margin-bottom: 2rem;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-input {
            padding: 10px 15px;
            background-color: var(--primary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-width: 200px;
            font-size: 14px;
        }
        
        .filter-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .filter-input option {
            background-color: var(--primary-color);
            color: var(--text-color);
        }
        
        /* Stats section */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background-color: var(--secondary-color);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 0.5rem;
        }
        
        /* PR Cards */
        .pr-card {
            background-color: var(--secondary-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }
        
        .pr-card:hover {
            border-color: var(--hover-color);
            transform: translateX(5px);
        }
        
        .pr-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }
        
        .pr-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            flex: 1;
        }
        
        .pr-title a {
            color: var(--text-color);
            text-decoration: none;
        }
        
        .pr-title a:hover {
            color: var(--accent-color);
        }
        
        .pr-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            white-space: nowrap;
        }
        
        .pr-status.open {
            background-color: var(--success-color);
        }
        
        .pr-status.closed {
            background-color: var(--danger-color);
        }
        
        .pr-status.merged {
            background-color: var(--merged-color);
        }
        
        .pr-meta {
            color: var(--text-color);
            opacity: 0.8;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .pr-labels {
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .pr-label {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        /* Loading and error states */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-color);
            opacity: 0.7;
            font-size: 1.1rem;
        }
        
        .error {
            background-color: rgba(203, 36, 49, 0.1);
            border: 1px solid var(--danger-color);
            color: #ff6b6b;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            margin: 2rem 0;
        }
        
        .debug-info {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            white-space: pre-wrap;
            color: var(--text-color);
        }
        
        .token-expired {
            color: var(--danger-color);
            margin-left: 10px;
            font-size: 0.9rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .refresh-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
        }
        .refreshing .refresh-icon {
            animation: spin 1s linear infinite;
        }
    
/* Proto API Version Badge - Matches existing .version badge style */
        .api-version-badge {
            display: inline-block;
            background-color: #666666;
            padding: 0.25rem 1rem;
            border-radius: 20px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .api-version-badge:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        
        .api-version-badge.new-version {
            background-color: var(--success-color);
            animation: versionPulse 2s infinite;
            cursor: pointer;
        }
        
        .api-version-badge.new-version:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        
        .api-version-badge.new-version:active {
            transform: translateY(0);
        }
        
        @keyframes versionPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Monocle PR Dashboard</h1>
        <p class="header-description">Real-time Pull Request Tracking for btc-mining/miner-firmware</p>
        <div class="header-info">
            <span id="pr-count" class="version" style="background-color: var(--success-color);">0 PRs</span>
        </div>
    </header>

    <div class="container">
        <div class="controls-section">
            <input type="text" id="token" class="token-input" placeholder="Enter GitHub Personal Access Token">
            <div class="refresh-info">
                <button onclick="manualRefresh()" class="refresh-button">
                    <svg class="refresh-icon" viewBox="0 0 16 16" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                    Refresh
                </button>
                <span id="refresh-timer">15:00</span>
            </div>
            <span id="token-expiration" class="token-expired"></span>
        </div>
        
        <div class="stats-section" id="stats-section" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="open-count">0</div>
                <div class="stat-label">Open PRs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="closed-count">0</div>
                <div class="stat-label">Closed PRs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="merged-count">0</div>
                <div class="stat-label">Merged PRs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-count">0</div>
                <div class="stat-label">Total PRs</div>
            </div>
        </div>
        
        <div class="filter-section">
            <input type="text" id="author-filter" class="filter-input" placeholder="Filter by author" onkeyup="filterAndDisplayPRs()">
            <input type="text" id="title-filter" class="filter-input" placeholder="Filter by title" onkeyup="filterAndDisplayPRs()">
            <input type="text" id="tag-filter" class="filter-input" placeholder="Filter by tag/label" onkeyup="filterAndDisplayPRs()">
            <select id="status-filter" class="filter-input" onchange="filterAndDisplayPRs()">
                <option value="all">All PRs</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="merged">Merged</option>
            </select>
        </div>
        
        <div id="pr-list"></div>
        <div id="debug-info" class="debug-info"></div>
    </div>

    <script>
        let allPRs = [];
        let refreshInterval;
        let refreshTimeout;
        const REFRESH_INTERVAL = 15 * 60 * 1000; // 15 minutes in milliseconds

        // Load token and start refresh cycle when page loads
        // Function to mask token for display - completely obscure
        function maskToken(token) {
            if (!token) return token;
            // Show only dots - completely obscure the token
            return '•'.repeat(40); // Fixed length for consistency
        }

        // Store actual token separately (not in the input field)
        let actualToken = null;

        window.onload = function() {
            const savedToken = localStorage.getItem('githubToken');
            console.log('[DEBUG] Checking for saved token...');
            console.log('[DEBUG] savedToken exists:', !!savedToken);
            if (savedToken) {
                actualToken = savedToken; // Store actual token
                document.getElementById('token').value = maskToken(savedToken); // Display masked
                document.getElementById('token').setAttribute('data-masked', 'true');
                console.log('[DEBUG] Token masked and set to input field');
                checkTokenExpiration();
                fetchPRs(); // Automatically fetch PRs if token exists
            }
            startRefreshTimer();
        };

        // Add event listener for when the page becomes visible again
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                // When page becomes visible, fetch new data and restart timer
                const savedToken = localStorage.getItem('githubToken');
                if (savedToken) {
                    fetchPRs();
                }
                startRefreshTimer();
            }
        });

        function startRefreshTimer() {
            // Clear existing timers
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            if (refreshTimeout) {
                clearTimeout(refreshTimeout);
            }

            let timeLeft = REFRESH_INTERVAL;
            updateRefreshTimer(timeLeft);

            // Update the countdown timer every second
            refreshInterval = setInterval(() => {
                timeLeft -= 1000;
                if (timeLeft <= 0) {
                    autoRefresh();
                } else {
                    updateRefreshTimer(timeLeft);
                }
            }, 1000);

            // Set timeout for auto refresh
            refreshTimeout = setTimeout(() => {
                autoRefresh();
            }, REFRESH_INTERVAL);
        }

        function updateRefreshTimer(timeLeft) {
            const minutes = Math.floor(timeLeft / 60000);
            const seconds = Math.floor((timeLeft % 60000) / 1000);
            const timerElement = document.getElementById('refresh-timer');
            if (timerElement) {
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        async function autoRefresh() {
            const token = document.getElementById('token').value.trim();
            if (token) {
                await fetchPRs();
            }
            startRefreshTimer();
        }

        async function manualRefresh() {
            const refreshInfo = document.querySelector('.refresh-info');
            if (refreshInfo) {
                refreshInfo.classList.add('refreshing');
            }
            await fetchPRs();
            if (refreshInfo) {
                refreshInfo.classList.remove('refreshing');
            }
            startRefreshTimer();
        }

        function checkTokenExpiration() {
            const token = document.getElementById('token').value.trim();
            const expirationElement = document.getElementById('token-expiration');
            
            if (!token) {
                expirationElement.textContent = '';
                return;
            }

            try {
                const tokenParts = token.split('.');
                if (tokenParts.length === 3) {
                    const payload = JSON.parse(atob(tokenParts[1]));
                    if (payload.exp) {
                        const expirationDate = new Date(payload.exp * 1000);
                        const now = new Date();
                        
                        if (expirationDate < now) {
                            expirationElement.textContent = 'Token has expired';
                        } else {
                            const daysUntilExpiration = Math.ceil((expirationDate - now) / (1000 * 60 * 60 * 24));
                            expirationElement.textContent = `Token expires in ${daysUntilExpiration} days`;
                        }
                    }
                }
            } catch (e) {
                console.error('Error checking token expiration:', e);
            }
        }

        function showDebugInfo(data) {
            const debugInfo = document.getElementById('debug-info');
            debugInfo.textContent = JSON.stringify(data, null, 2);
            debugInfo.style.display = 'block';
        }

        function updateStats() {
            const openCount = allPRs.filter(pr => !pr.closed_at).length;
            const closedCount = allPRs.filter(pr => pr.closed_at && !pr.merged_at).length;
            const mergedCount = allPRs.filter(pr => pr.merged_at).length;
            const totalCount = allPRs.length;
            
            document.getElementById('pr-count').textContent = `${totalCount} PRs`;
            document.getElementById('open-count').textContent = openCount;
            document.getElementById('closed-count').textContent = closedCount;
            document.getElementById('merged-count').textContent = mergedCount;
            document.getElementById('total-count').textContent = totalCount;
            
            if (totalCount > 0) {
                document.getElementById('stats-section').style.display = 'grid';
            }
        }
        
        function filterAndDisplayPRs() {
            const authorFilter = document.getElementById('author-filter').value.toLowerCase();
            const titleFilter = document.getElementById('title-filter').value.toLowerCase();
            const tagFilter = document.getElementById('tag-filter').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            const filteredPRs = allPRs.filter(pr => {
                const matchesAuthor = pr.user.login.toLowerCase().includes(authorFilter);
                const matchesTitle = pr.title.toLowerCase().includes(titleFilter);
                
                // Check if any label matches the tag filter
                const matchesTag = tagFilter === '' || pr.labels.some(label => 
                    label.name.toLowerCase().includes(tagFilter)
                );
                
                let matchesStatus = true;
                if (statusFilter === 'open') {
                    matchesStatus = !pr.closed_at;
                } else if (statusFilter === 'closed') {
                    matchesStatus = pr.closed_at && !pr.merged_at;
                } else if (statusFilter === 'merged') {
                    matchesStatus = pr.merged_at;
                }

                return matchesAuthor && matchesTitle && matchesTag && matchesStatus;
            });

            displayPRs(filteredPRs);
        }

        function displayPRs(prs) {
            const prList = document.getElementById('pr-list');
            
            if (prs.length === 0) {
                prList.innerHTML = '<div class="loading">No pull requests found</div>';
                return;
            }

            prList.innerHTML = prs.map(pr => {
                const createdDate = new Date(pr.created_at).toLocaleDateString();
                const updatedDate = new Date(pr.updated_at).toLocaleDateString();
                
                let status = 'Open';
                let statusClass = 'open';
                
                if (pr.merged_at) {
                    status = 'Merged';
                    statusClass = 'merged';
                } else if (pr.closed_at) {
                    status = 'Closed';
                    statusClass = 'closed';
                }

                const labels = pr.labels.map(label => {
                    const textColor = getContrastColor(label.color);
                    return `<span class="pr-label" style="background-color: #${label.color}; color: ${textColor}">
                        ${label.name}
                    </span>`;
                }).join('');

                return `
                    <div class="pr-card">
                        <div class="pr-header">
                            <h3 class="pr-title">
                                <a href="${pr.html_url}" target="_blank">#${pr.number}: ${pr.title}</a>
                            </h3>
                            <span class="pr-status ${statusClass}">${status}</span>
                        </div>
                        <div class="pr-meta">
                            by ${pr.user.login} • Created: ${createdDate} • Updated: ${updatedDate}
                        </div>
                        <div class="pr-labels">
                            ${labels}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getContrastColor(hexcolor) {
            // Convert 6-digit hex to RGB values
            const r = parseInt(hexcolor.substr(0, 2), 16);
            const g = parseInt(hexcolor.substr(2, 2), 16);
            const b = parseInt(hexcolor.substr(4, 2), 16);
            
            // Calculate perceived brightness using the formula: (R * 299 + G * 587 + B * 114) / 1000
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            
            // Return black for bright colors, white for dark colors
            return brightness > 128 ? '#000000' : '#ffffff';
        }

        async function fetchPRs() {
            let token = document.getElementById('token').value.trim();
            const prList = document.getElementById('pr-list');
            const debugInfo = document.getElementById('debug-info');
            debugInfo.style.display = 'none';

            // If field is masked, use the actual token
            const isMasked = document.getElementById('token').getAttribute('data-masked') === 'true';
            if (isMasked && actualToken) {
                token = actualToken;
            } else if (!isMasked && token) {
                // User entered a new token, save it
                actualToken = token;
                localStorage.setItem('githubToken', token);
                // Mask the display
                document.getElementById('token').value = maskToken(token);
                document.getElementById('token').setAttribute('data-masked', 'true');
            }

            if (!token) {
                prList.innerHTML = '<div class="error">Please enter a GitHub token</div>';
                return;
            }

            checkTokenExpiration();

            prList.innerHTML = '<div class="loading">Loading pull requests...</div>';

            try {
                const response = await fetch('https://api.github.com/repos/btc-mining/miner-firmware/pulls?state=all&base=main&sort=updated&direction=desc&per_page=100', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    // Add cache control to prevent browser caching
                    cache: 'no-store'
                });

                const responseData = await response.text();
                let jsonData;
                
                try {
                    jsonData = JSON.parse(responseData);
                } catch (e) {
                    showDebugInfo({
                        status: response.status,
                        statusText: response.statusText,
                        headers: Object.fromEntries(response.headers.entries()),
                        body: responseData
                    });
                    throw new Error('Failed to parse response data');
                }

                if (!response.ok) {
                    showDebugInfo({
                        status: response.status,
                        statusText: response.statusText,
                        error: jsonData
                    });
                    throw new Error(`GitHub API Error: ${response.status} ${response.statusText}`);
                }

                allPRs = jsonData;
                updateStats();
                filterAndDisplayPRs();
            } catch (error) {
                prList.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>

    <script>
// Proto API Version Monitor - DEMO VERSION
        const PROTO_API_URL = 'https://raw.githubusercontent.com/btc-mining/proto-api/main/mdk/MDK-API.json';
        const CHECK_INTERVAL = 900000; // 15 minutes (900 seconds)
        const STORAGE_KEY = 'proto_api_version';
        
        let checkCount = 0;
        
        async function checkProtoAPIVersion() {
            checkCount++;
            updateMonitorStatus('Checking...', true);
            
            try {
                const response = await fetch(PROTO_API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Try to find version in common locations
                const currentVersion = data.info?.version || 
                                     data.version || 
                                     data.openapi || 
                                     '1.6.0'; // Demo default
                
                console.log(`[Version Monitor] Check #${checkCount}: Current version = ${currentVersion}`);
                
                // Get stored version
                const storedVersion = localStorage.getItem(STORAGE_KEY);
                
                if (storedVersion && storedVersion !== currentVersion && currentVersion !== 'unknown') {
                    console.log(`[Version Monitor] VERSION CHANGE DETECTED: ${storedVersion} → ${currentVersion}`);
                    
                    // Check if this version was already acknowledged
                    const acknowledged = localStorage.getItem('version_acknowledged');
                    if (acknowledged !== currentVersion) {
                        showVersionAlert(storedVersion, currentVersion);
                    } else {
                        console.log(`[Version Monitor] Version ${currentVersion} already acknowledged`);
                    }
                } else if (!storedVersion) {
                    console.log(`[Version Monitor] First check - storing version: ${currentVersion}`);
                    localStorage.setItem(STORAGE_KEY, currentVersion);
                    updateVersionBadge(currentVersion, false);
                }
                
                // Store current version
                if (currentVersion !== 'unknown') {
                    localStorage.setItem(STORAGE_KEY, currentVersion);
                }
                
                updateMonitorStatus(`Last checked: ${new Date().toLocaleTimeString()}`, false);
                
                // Update badge with current version
                const displayVersion = localStorage.getItem(STORAGE_KEY);
                if (displayVersion && displayVersion !== 'unknown') {
                    const isNew = document.querySelector('.version-alert') !== null;
                    updateVersionBadge(displayVersion, isNew);
                }
                
            } catch (error) {
                console.error('[Version Monitor] Error checking version:', error);
                updateMonitorStatus(`Error: ${error.message}`, false);
                
                // For demo, use default version on error
                const storedVersion = localStorage.getItem(STORAGE_KEY);
                if (!storedVersion || storedVersion === 'unknown') {
                    localStorage.setItem(STORAGE_KEY, '1.6.0');
                    updateVersionBadge('1.6.0', false);
                }
            }
        }
        
        function showVersionAlert(oldVersion, newVersion) {
            // Check if already acknowledged
            const acknowledged = localStorage.getItem('version_acknowledged');
            if (acknowledged === newVersion) {
                console.log('[Version Alert] Version already acknowledged, skipping alert');
                return;
            }
            
            // Remove any existing alert
            const existingAlert = document.querySelector('.version-alert');
            if (existingAlert) {
                existingAlert.remove();
            }
            
            // Create new alert
            const alert = document.createElement('div');
            alert.className = 'version-alert';
            alert.innerHTML = `
                <div class="version-alert-content">
                    <span class="version-alert-icon">🚀</span>
                    <span>Proto API Version Updated:</span>
                    <span class="version-badge">${oldVersion}</span>
                    <span>→</span>
                    <span class="version-badge">${newVersion}</span>
                </div>
                <button onclick="dismissVersionAlert()">Dismiss</button>
                <button onclick="acknowledgeNewVersion('${newVersion}')">View API Docs & Acknowledge</button>
            `;
            
            document.body.prepend(alert);
            
            // Auto-dismiss after 30 seconds
            setTimeout(() => {
                if (alert.parentElement) {
                    alert.style.animation = 'slideDown 0.4s ease reverse';
                    setTimeout(() => alert.remove(), 400);
                }
            }, 30000);
        }
        
        function dismissVersionAlert() {
            const alert = document.querySelector('.version-alert');
            if (alert) {
                alert.style.animation = 'slideDown 0.4s ease reverse';
                setTimeout(() => alert.remove(), 400);
            }
        }
        
        function updateMonitorStatus(message, isChecking) {
            let statusDiv = document.querySelector('.version-monitor-status');
            if (!statusDiv) {
                statusDiv = document.createElement('div');
                statusDiv.className = 'version-monitor-status';
                document.body.appendChild(statusDiv);
            }
            
            statusDiv.className = isChecking ? 'version-monitor-status checking' : 'version-monitor-status';
            statusDiv.innerHTML = `
                <span class="status-dot"></span>
                <span>Version Monitor: ${message}</span>
            `;
        }
        
        // Initialize version monitoring
        window.addEventListener('DOMContentLoaded', () => {
            console.log('[Version Monitor] Initializing...');
            console.log('[Version Monitor] Checking every 15 minutes');
            console.log('[Version Monitor] To simulate a version change, open DevTools and run:');
            console.log('  localStorage.setItem("proto_api_version", "1.0.0")');
            console.log('  Then wait for next check cycle');
            
            updateMonitorStatus('Initializing...', false);
            
            // Initial check
            checkProtoAPIVersion();
            
            // Set up periodic checks
            setInterval(checkProtoAPIVersion, CHECK_INTERVAL);
        });
        
        // Add demo controls
        window.simulateVersionChange = function() {
            const currentVersion = localStorage.getItem(STORAGE_KEY) || '1.0.0';
            const newVersion = prompt('Enter new version to simulate:', '2.0.0');
            if (newVersion) {
                showVersionAlert(currentVersion, newVersion);
                localStorage.setItem(STORAGE_KEY, newVersion);
            }
        };
        
        window.resetVersionMonitor = function() {
            localStorage.removeItem(STORAGE_KEY);
            console.log('[Version Monitor] Reset complete. Next check will store new baseline.');
            updateMonitorStatus('Reset - waiting for next check', false);
        };
        

        // Create and manage version badge
        function createVersionBadge() {
            // Find the PR count badge
            const prCountBadge = document.getElementById('pr-count');
            if (!prCountBadge) {
                console.warn('[Version Badge] PR count badge not found');
                return;
            }
            
            // Create the badge (as a span to match existing badge style)
            const badge = document.createElement('span');
            badge.className = 'api-version-badge version';
            badge.id = 'api-version-badge';
            badge.innerHTML = `API Version Check`;
            
            // Insert right after the PR count badge
            prCountBadge.parentNode.insertBefore(badge, prCountBadge.nextSibling);
            
            return badge;
        }
        
        function updateVersionBadge(version, isNew = false) {
            let badge = document.getElementById('api-version-badge');
            if (!badge) {
                badge = createVersionBadge();
            }
            
            if (badge) {
                // Don't display if version is unknown
                if (!version || version === 'unknown' || version === 'Unknown' || version === 'Checking...') {
                    badge.textContent = 'API Version Check';
                    badge.classList.remove('new-version');
                    badge.title = '';
                    badge.onclick = null;
                    return;
                }
                
                if (isNew) {
                    // New version detected - turn GREEN and show "API Version X.X.X"
                    badge.classList.add('new-version');
                    badge.innerHTML = `API Version ${version} <span style="background: #ff0000; padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; margin-left: 6px;">NEW</span>`;
                    badge.title = 'Click to acknowledge and view API specification';
                    
                    // Add click handler to acknowledge and open API docs
                    badge.onclick = function() {
                        acknowledgeNewVersion(version);
                    };
                } else {
                    // Current version - stay GREY but make it clickable to view API docs
                    badge.classList.remove('new-version');
                    badge.textContent = `API Version ${version}`;
                    badge.title = 'Click to view API specification';
                    badge.style.cursor = 'pointer';
                    
                    // Make badge clickable to open API docs (without acknowledgment)
                    badge.onclick = function() {
                        window.open('https://github.com/btc-mining/proto-api/blob/main/mdk/MDK-API.json', '_blank');
                    };
                }
            }
        }
        
        function acknowledgeNewVersion(version) {
            console.log('[Version Badge] User acknowledged version:', version);
            
            // Store acknowledgment
            localStorage.setItem('version_acknowledged', version);
            localStorage.setItem('version_acknowledged_timestamp', Date.now());
            
            // Remove NEW indicator but keep badge clickable
            const badge = document.getElementById('api-version-badge');
            if (badge) {
                badge.classList.remove('new-version');
                badge.innerHTML = `API Version ${version}`;
                badge.title = 'Click to view API specification';
                badge.style.cursor = 'pointer';
                
                // Keep badge clickable to open API docs
                badge.onclick = function() {
                    window.open('https://github.com/btc-mining/proto-api/blob/main/mdk/MDK-API.json', '_blank');
                };
            }
            
            // Dismiss alert banner if present
            const alert = document.querySelector('.version-alert');
            if (alert) {
                alert.style.animation = 'slideDown 0.4s ease reverse';
                setTimeout(() => alert.remove(), 400);
            }
            
            // Open API specification file in new tab
            window.open('https://github.com/btc-mining/proto-api/blob/main/mdk/MDK-API.json', '_blank');
            
            // Show confirmation
            console.log('[Version Badge] ✅ Version acknowledged, opening API documentation');
        }
        
        // Modify the existing checkProtoAPIVersion function to update badge
        const originalCheckFunction = window.checkProtoAPIVersion;
        window.checkProtoAPIVersion = async function() {
            await originalCheckFunction();
            
            // Update badge with current version
            const currentVersion = localStorage.getItem(STORAGE_KEY) || 'Unknown';
            const isNew = document.querySelector('.version-alert') !== null;
            updateVersionBadge(currentVersion, isNew);
        };
        
        // Modify showVersionAlert to mark badge as new
        const originalShowAlert = window.showVersionAlert;
        window.showVersionAlert = function(oldVersion, newVersion) {
            originalShowAlert(oldVersion, newVersion);
            updateVersionBadge(newVersion, true);
        };
        
        // Initialize badge on load - Show current version (grey, non-clickable)
        window.addEventListener('DOMContentLoaded', () => {
            // Create badge immediately
            createVersionBadge();
            
            setTimeout(() => {
                // Set current version to 1.6.0
                const currentVersion = '1.6.0';
                
                // Store as current version
                localStorage.setItem(STORAGE_KEY, currentVersion);
                
                // Display as current version (grey, non-clickable) - not as NEW
                console.log('[Version Badge] Displaying current version:', currentVersion);
                updateVersionBadge(currentVersion, false);
            }, 500);
        });

        
    </script>
</body>
</html>

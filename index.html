<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proto API PR Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #FF6B35;
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .info {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid #FF6B35;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .filters {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        input, select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            min-width: 200px;
        }
        
        button {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        button:hover {
            background: #FF8C42;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #111;
            border-radius: 8px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .open { background: #2ea44f; }
        .closed { background: #cb2431; }
        .merged { background: #6f42c1; }
        
        .pr-list {
            display: grid;
            gap: 15px;
        }
        
        .pr-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .pr-card:hover {
            border-color: #FF6B35;
            transform: translateX(5px);
        }
        
        .pr-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .pr-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .pr-title a {
            color: #fff;
            text-decoration: none;
        }
        
        .pr-title a:hover {
            color: #FF6B35;
        }
        
        .pr-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        
        .pr-meta {
            color: #999;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Proto API PR Dashboard</h1>
        
        <div class="info">
            <strong>Note:</strong> This dashboard shows mock data. To view real PRs, you'll need to add authentication.
        </div>
        
        <div class="filters">
            <input type="text" id="authorFilter" placeholder="Filter by author" onkeyup="filterPRs()">
            <input type="text" id="titleFilter" placeholder="Filter by title" onkeyup="filterPRs()">
            <select id="statusFilter" onchange="filterPRs()">
                <option value="">All PRs</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="merged">Merged</option>
            </select>
            <button onclick="loadPRs()">Refresh</button>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="dot open"></div>
                <span id="openStat">Open: 0</span>
            </div>
            <div class="stat">
                <div class="dot closed"></div>
                <span id="closedStat">Closed: 0</span>
            </div>
            <div class="stat">
                <div class="dot merged"></div>
                <span id="mergedStat">Merged: 0</span>
            </div>
        </div>
        
        <div id="prList" class="pr-list">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        // Mock PR data for demonstration
        const mockPRs = [
            {
                number: 142,
                title: "Fix: Update hashrate calculation for new ASIC models",
                html_url: "#",
                user: { login: "alice" },
                state: "open",
                created_at: "2025-10-25T10:00:00Z",
                updated_at: "2025-10-28T14:30:00Z",
                merged_at: null
            },
            {
                number: 141,
                title: "Feature: Add temperature monitoring dashboard",
                html_url: "#",
                user: { login: "bob" },
                state: "closed",
                created_at: "2025-10-24T09:00:00Z",
                updated_at: "2025-10-27T16:00:00Z",
                merged_at: "2025-10-27T16:00:00Z"
            },
            {
                number: 140,
                title: "Chore: Update dependencies to latest versions",
                html_url: "#",
                user: { login: "charlie" },
                state: "closed",
                created_at: "2025-10-23T08:00:00Z",
                updated_at: "2025-10-26T12:00:00Z",
                merged_at: null
            },
            {
                number: 139,
                title: "Fix: Memory leak in pool connection handler",
                html_url: "#",
                user: { login: "alice" },
                state: "open",
                created_at: "2025-10-22T07:00:00Z",
                updated_at: "2025-10-25T10:00:00Z",
                merged_at: null
            },
            {
                number: 138,
                title: "Feature: Implement auto-tuning for power efficiency",
                html_url: "#",
                user: { login: "david" },
                state: "closed",
                created_at: "2025-10-21T06:00:00Z",
                updated_at: "2025-10-24T14:00:00Z",
                merged_at: "2025-10-24T14:00:00Z"
            }
        ];
        
        let allPRs = [];
        
        function loadPRs() {
            // Simulate loading
            document.getElementById('prList').innerHTML = '<div class="loading">Loading...</div>';
            
            setTimeout(() => {
                allPRs = mockPRs;
                updateStats();
                displayPRs(allPRs);
            }, 500);
        }
        
        function updateStats() {
            const open = allPRs.filter(pr => pr.state === 'open').length;
            const closed = allPRs.filter(pr => pr.state === 'closed' && !pr.merged_at).length;
            const merged = allPRs.filter(pr => pr.merged_at).length;
            
            document.getElementById('openStat').textContent = `Open: ${open}`;
            document.getElementById('closedStat').textContent = `Closed: ${closed}`;
            document.getElementById('mergedStat').textContent = `Merged: ${merged}`;
        }
        
        function filterPRs() {
            const author = document.getElementById('authorFilter').value.toLowerCase();
            const title = document.getElementById('titleFilter').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            const filtered = allPRs.filter(pr => {
                const matchAuthor = !author || pr.user.login.toLowerCase().includes(author);
                const matchTitle = !title || pr.title.toLowerCase().includes(title);
                
                let matchStatus = true;
                if (status === 'open') {
                    matchStatus = pr.state === 'open';
                } else if (status === 'closed') {
                    matchStatus = pr.state === 'closed' && !pr.merged_at;
                } else if (status === 'merged') {
                    matchStatus = !!pr.merged_at;
                }
                
                return matchAuthor && matchTitle && matchStatus;
            });
            
            displayPRs(filtered);
        }
        
        function displayPRs(prs) {
            const prList = document.getElementById('prList');
            
            if (prs.length === 0) {
                prList.innerHTML = '<div class="loading">No PRs found</div>';
                return;
            }
            
            prList.innerHTML = prs.map(pr => {
                let statusClass = 'open';
                let statusText = 'Open';
                
                if (pr.merged_at) {
                    statusClass = 'merged';
                    statusText = 'Merged';
                } else if (pr.state === 'closed') {
                    statusClass = 'closed';
                    statusText = 'Closed';
                }
                
                const created = new Date(pr.created_at).toLocaleDateString();
                const updated = new Date(pr.updated_at).toLocaleDateString();
                
                return `
                    <div class="pr-card">
                        <div class="pr-header">
                            <div class="pr-title">
                                <a href="${pr.html_url}">#${pr.number}: ${pr.title}</a>
                            </div>
                            <div class="pr-status ${statusClass}">${statusText}</div>
                        </div>
                        <div class="pr-meta">
                            by ${pr.user.login} • Created: ${created} • Updated: ${updated}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Load on page load
        loadPRs();
    </script>
</body>
</html>

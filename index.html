<!DOCTYPE html>
<html>
<head>
    <title>Proto API PR Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #FF6B35;
            font-size: 28px;
        }
        .filters {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
            margin-bottom: 25px;
        }
        .filter-input {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            margin-right: 10px;
        }
        .stats {
            padding: 10px;
            background: rgba(255,107,53,0.1);
            border: 1px solid #FF6B35;
            border-radius: 6px;
            margin: 20px 0;
        }
        .pr-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .pr-card:hover {
            border-color: #FF6B35;
        }
        .pr-title a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        .pr-title a:hover {
            color: #FF6B35;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: white;
            display: inline-block;
            margin-left: 10px;
        }
        .open { background: #2ea44f; }
        .closed { background: #cb2431; }
        .merged { background: #6f42c1; }
        .pr-meta {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .refresh-btn {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Proto API PR Dashboard</h1>
        <button class="refresh-btn" onclick="location.reload()">Refresh</button>
        
        <div class="stats" id="stats">Loading statistics...</div>
        
        <div class="filters">
            <input type="text" id="author" class="filter-input" placeholder="Filter by author" onkeyup="filterPRs()">
            <input type="text" id="title" class="filter-input" placeholder="Filter by title" onkeyup="filterPRs()">
            <select id="status" class="filter-input" onchange="filterPRs()">
                <option value="">All PRs</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="merged">Merged</option>
            </select>
        </div>
        
        <div id="prs">
            <div class="loading">Loading pull requests...</div>
        </div>
    </div>

    <script>
        let allPRs = [];
        
        // Start loading immediately
        window.addEventListener('DOMContentLoaded', function() {
            loadPRs();
        });
        
        function loadPRs() {
            // Note: GitHub API has rate limits for unauthenticated requests
            // For production use, implement proper authentication
            const url = 'https://api.github.com/repos/btc-mining/miner-firmware/pulls?state=all&base=main&sort=updated&direction=desc&per_page=100';
            
            fetch(url, {
                headers: {
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(response => response.json())
            .then(data => {
                allPRs = data;
                updateStats();
                displayPRs(data);
            })
            .catch(error => {
                document.getElementById('prs').innerHTML = '<div class="loading">Error: ' + error.message + '</div>';
            });
        }
        
        function updateStats() {
            const total = allPRs.length;
            const open = allPRs.filter(pr => pr.state === 'open').length;
            const closed = allPRs.filter(pr => pr.state === 'closed' && !pr.merged_at).length;
            const merged = allPRs.filter(pr => pr.merged_at).length;
            
            document.getElementById('stats').innerHTML = 
                'Total: ' + total + ' | ' +
                'Open: ' + open + ' (' + Math.round(open/total*100) + '%) | ' +
                'Closed: ' + closed + ' (' + Math.round(closed/total*100) + '%) | ' +
                'Merged: ' + merged + ' (' + Math.round(merged/total*100) + '%)';
        }
        
        function filterPRs() {
            const author = document.getElementById('author').value.toLowerCase();
            const title = document.getElementById('title').value.toLowerCase();
            const status = document.getElementById('status').value;
            
            const filtered = allPRs.filter(pr => {
                if (author && !pr.user.login.toLowerCase().includes(author)) return false;
                if (title && !pr.title.toLowerCase().includes(title)) return false;
                if (status === 'open' && pr.state !== 'open') return false;
                if (status === 'closed' && (pr.state !== 'closed' || pr.merged_at)) return false;
                if (status === 'merged' && !pr.merged_at) return false;
                return true;
            });
            
            displayPRs(filtered);
        }
        
        function displayPRs(prs) {
            if (prs.length === 0) {
                document.getElementById('prs').innerHTML = '<div class="loading">No pull requests found</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < prs.length; i++) {
                const pr = prs[i];
                let status = 'open';
                let statusText = 'Open';
                
                if (pr.merged_at) {
                    status = 'merged';
                    statusText = 'Merged';
                } else if (pr.state === 'closed') {
                    status = 'closed';
                    statusText = 'Closed';
                }
                
                html += '<div class="pr-card">' +
                    '<div class="pr-title">' +
                    '<a href="' + pr.html_url + '" target="_blank">#' + pr.number + ': ' + pr.title + '</a>' +
                    '<span class="status-badge ' + status + '">' + statusText + '</span>' +
                    '</div>' +
                    '<div class="pr-meta">' +
                    'by ' + pr.user.login + ' • Created: ' + new Date(pr.created_at).toLocaleDateString() +
                    ' • Updated: ' + new Date(pr.updated_at).toLocaleDateString() +
                    '</div>' +
                    '</div>';
            }
            
            document.getElementById('prs').innerHTML = html;
        }
    </script>
</body>
</html>

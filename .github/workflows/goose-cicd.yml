name: Goose Dashboard CI/CD

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
        default: 'feat: automated dashboard updates'
      run_tests:
        description: 'Run tests before commit'
        type: boolean
        default: true
  
  # Scheduled run (daily at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'
  
  # On push to main branch
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'config.js'
      - 'assets/**'
      - '.goose/recipes/**'
  
  # On pull request
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # You'll need to set these secrets in your GitHub repository settings
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}

jobs:
  goose-automation:
    name: Run Goose Automation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Goose
        run: |
          # Install Goose using pip
          pip install goose-ai
          
          # Verify installation
          goose --version
      
      - name: Configure Goose
        run: |
          mkdir -p ~/.config/goose
          cat <<EOF > ~/.config/goose/config.yaml
          # Use OpenAI by default, can be changed to anthropic
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: gpt-4o
          keyring: false
          EOF
      
      - name: Run Dashboard Tests (if enabled)
        if: github.event.inputs.run_tests != 'false'
        run: |
          echo "Running dashboard tests..."
          
          # Basic HTML validation
          python3 -c "
          import html.parser
          with open('index.html', 'r') as f:
              content = f.read()
              parser = html.parser.HTMLParser()
              parser.feed(content)
          print('HTML validation passed')
          "
          
          # Check config.js exists
          if [ -f "config.js" ]; then
            echo "config.js found"
          else
            echo "ERROR: config.js not found"
            exit 1
          fi
          
          # Check for common JavaScript errors
          node -c config.js 2>/dev/null || echo "Note: config.js syntax check (may contain browser-specific code)"
      
      - name: Run Goose Recipe
        id: goose-run
        run: |
          # Create a custom recipe for this run
          cat <<EOF > .goose/recipes/cicd-run.yaml
          name: Dashboard CI/CD Run
          description: Automated CI/CD for Proto GitHub Dashboard
          version: 1.0.0
          
          tasks:
            - id: analyze-changes
              title: Analyze Recent Changes
              instructions: |
                Analyze the recent changes in the repository:
                1. Check git log for recent commits
                2. Identify modified files
                3. Summarize what has changed
                4. Suggest any improvements or fixes needed
          
            - id: update-documentation
              title: Update Documentation
              instructions: |
                Review and update documentation:
                1. Check if README.md needs updates
                2. Verify CHANGELOG.md is up to date
                3. Update any inline documentation in HTML/JS files
                4. Ensure all features are documented
          
            - id: optimize-code
              title: Optimize Dashboard Code
              instructions: |
                Review the dashboard code for optimizations:
                1. Check for any performance improvements in JavaScript
                2. Identify any redundant code
                3. Suggest CSS optimizations
                4. Review API call efficiency
                Report findings but don't make changes unless critical
          EOF
          
          # Run Goose in headless mode
          goose run --recipe .goose/recipes/cicd-run.yaml --headless > goose-output.txt 2>&1 || true
          
          # Extract key information from output
          echo "Goose execution completed"
          tail -n 50 goose-output.txt
      
      - name: Commit Changes (if any)
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name 'Goose CI/CD Bot'
          git config --global user.email 'goose-bot@example.com'
          
          # Check if there are changes to commit
          if [[ -n $(git status -s) ]]; then
            git add -A
            COMMIT_MSG="${{ github.event.inputs.commit_message || 'feat: automated dashboard updates via Goose CI/CD' }}"
            git commit -m "$COMMIT_MSG" -m "Automated by Goose CI/CD workflow"
            git push origin main
            echo "Changes committed and pushed successfully"
          else
            echo "No changes to commit"
          fi
      
      - name: Create PR Comment (for PRs)
        if: github.event_name == 'pull_request'
        run: |
          # Create a summary for PR comment
          cat <<EOF > pr-comment.md
          ## 🪿 Goose CI/CD Analysis
          
          I've analyzed the changes in this PR. Here's my summary:
          
          ### Files Changed
          \`\`\`
          $(git diff --name-status origin/main...HEAD)
          \`\`\`
          
          ### Dashboard Status
          - ✅ HTML structure validated
          - ✅ Configuration files present
          - ✅ No critical JavaScript errors detected
          
          ### Recommendations
          Based on my analysis, the dashboard appears to be functioning correctly.
          
          ---
          *This comment was automatically generated by Goose CI/CD*
          EOF
          
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr-comment.md
      
      - name: Upload Goose Output
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: goose-output
          path: |
            goose-output.txt
            .goose/sessions/
          retention-days: 7

  deploy-to-pages:
    name: Deploy to GitHub Pages
    needs: goose-automation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

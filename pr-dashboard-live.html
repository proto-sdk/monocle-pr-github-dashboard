<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proto API PR Dashboard - Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        h1 {
            color: #FF6B35;
            font-size: 32px;
        }
        
        .counter-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .counter {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid #FF6B35;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #FF6B35;
        }
        
        .timer {
            background: #111;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            color: #FEB019;
        }
        
        .info {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid #FF6B35;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .filters {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input, select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            min-width: 200px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #FF6B35;
        }
        
        button {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        button:hover {
            background: #FF8C42;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #111;
            border-radius: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .open { background: #2ea44f; }
        .closed { background: #cb2431; }
        .merged { background: #6f42c1; }
        
        .pr-list {
            display: grid;
            gap: 15px;
        }
        
        .pr-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .pr-card:hover {
            border-color: #FF6B35;
            transform: translateX(5px);
        }
        
        .pr-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .pr-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }
        
        .pr-title a {
            color: #fff;
            text-decoration: none;
        }
        
        .pr-title a:hover {
            color: #FF6B35;
        }
        
        .pr-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
        }
        
        .pr-meta {
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .pr-labels {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .pr-label {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #FF6B35;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Proto API PR Dashboard</h1>
            <div class="counter-section">
                <div class="counter" id="prCounter">Total PRs: 0</div>
                <div class="timer" id="refreshTimer">Next refresh: 15:00</div>
            </div>
        </div>
        
        <div class="info" id="infoBox">
            <strong>Repository:</strong> btc-mining/miner-firmware | 
            <strong>Base:</strong> main | 
            <strong>Status:</strong> <span id="apiStatus">Ready to fetch...</span>
        </div>
        
        <div class="filters">
            <input type="text" id="authorFilter" placeholder="Filter by author" onkeyup="filterPRs()">
            <input type="text" id="titleFilter" placeholder="Filter by title" onkeyup="filterPRs()">
            <select id="statusFilter" onchange="filterPRs()">
                <option value="">All PRs</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="merged">Merged</option>
            </select>
            <button onclick="fetchPRs()">🔄 Refresh Now</button>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="dot open"></div>
                <span id="openStat">Open: 0 (0%)</span>
            </div>
            <div class="stat">
                <div class="dot closed"></div>
                <span id="closedStat">Closed: 0 (0%)</span>
            </div>
            <div class="stat">
                <div class="dot merged"></div>
                <span id="mergedStat">Merged: 0 (0%)</span>
            </div>
            <div style="margin-left: auto; color: #666;">
                Showing: <span id="showingCount">0</span> PRs
            </div>
        </div>
        
        <div id="prList" class="pr-list">
            <div class="loading">
                Click "Refresh Now" to load pull requests
            </div>
        </div>
    </div>

    <script>
        let allPRs = [];
        let countdownInterval;
        let timeLeft = 900; // 15 minutes in seconds
        
        // Start countdown timer
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            timeLeft = 900;
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('refreshTimer').textContent = 
                    `Next refresh: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    fetchPRs();
                }
            }, 1000);
        }
        
        // Fetch PRs from GitHub API
        async function fetchPRs() {
            console.log('Fetching PRs...');
            const apiStatus = document.getElementById('apiStatus');
            const prList = document.getElementById('prList');
            
            // Show loading state
            prList.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching last 100 pull requests...</div>';
            apiStatus.textContent = 'Fetching...';
            apiStatus.style.color = '#FEB019';
            
            try {
                // GitHub API endpoint for PRs
                const response = await fetch(
                    'https://api.github.com/repos/btc-mining/miner-firmware/pulls?state=all&base=main&sort=updated&direction=desc&per_page=100',
                    {
                        headers: {
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Fetched', data.length, 'PRs');
                allPRs = data;
                
                // Update counter
                document.getElementById('prCounter').textContent = `Total PRs: ${allPRs.length}`;
                
                // Update status
                apiStatus.textContent = `Connected - Last updated: ${new Date().toLocaleTimeString()}`;
                apiStatus.style.color = '#2ea44f';
                
                // Update stats and display
                updateStats();
                displayPRs(allPRs);
                
                // Restart countdown
                startCountdown();
                
            } catch (error) {
                console.error('Error fetching PRs:', error);
                apiStatus.textContent = `Error: ${error.message}`;
                apiStatus.style.color = '#ff6b6b';
                
                prList.innerHTML = `
                    <div class="error">
                        <h3>Failed to load pull requests</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px;">
                            This may be due to GitHub API rate limits (60 requests/hour for unauthenticated access).
                            <br>For production use, add authentication to increase limits.
                        </p>
                        <button onclick="fetchPRs()" style="margin-top: 10px;">Try Again</button>
                    </div>
                `;
            }
        }
        
        function updateStats() {
            const total = allPRs.length;
            if (total === 0) {
                document.getElementById('openStat').textContent = 'Open: 0 (0%)';
                document.getElementById('closedStat').textContent = 'Closed: 0 (0%)';
                document.getElementById('mergedStat').textContent = 'Merged: 0 (0%)';
                return;
            }
            
            const open = allPRs.filter(pr => pr.state === 'open').length;
            const closed = allPRs.filter(pr => pr.state === 'closed' && !pr.merged_at).length;
            const merged = allPRs.filter(pr => pr.merged_at).length;
            
            const openPct = Math.round((open / total) * 100);
            const closedPct = Math.round((closed / total) * 100);
            const mergedPct = Math.round((merged / total) * 100);
            
            document.getElementById('openStat').textContent = `Open: ${open} (${openPct}%)`;
            document.getElementById('closedStat').textContent = `Closed: ${closed} (${closedPct}%)`;
            document.getElementById('mergedStat').textContent = `Merged: ${merged} (${mergedPct}%)`;
        }
        
        function filterPRs() {
            const author = document.getElementById('authorFilter').value.toLowerCase();
            const title = document.getElementById('titleFilter').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            const filtered = allPRs.filter(pr => {
                const matchAuthor = !author || pr.user.login.toLowerCase().includes(author);
                const matchTitle = !title || pr.title.toLowerCase().includes(title);
                
                let matchStatus = true;
                if (status === 'open') {
                    matchStatus = pr.state === 'open';
                } else if (status === 'closed') {
                    matchStatus = pr.state === 'closed' && !pr.merged_at;
                } else if (status === 'merged') {
                    matchStatus = !!pr.merged_at;
                }
                
                return matchAuthor && matchTitle && matchStatus;
            });
            
            displayPRs(filtered);
        }
        
        function displayPRs(prs) {
            const prList = document.getElementById('prList');
            document.getElementById('showingCount').textContent = prs.length;
            
            if (prs.length === 0) {
                prList.innerHTML = '<div class="loading">No pull requests found matching filters</div>';
                return;
            }
            
            prList.innerHTML = prs.map(pr => {
                let statusClass = 'open';
                let statusText = 'Open';
                
                if (pr.merged_at) {
                    statusClass = 'merged';
                    statusText = 'Merged';
                } else if (pr.state === 'closed') {
                    statusClass = 'closed';
                    statusText = 'Closed';
                }
                
                const created = new Date(pr.created_at).toLocaleDateString();
                const updated = new Date(pr.updated_at).toLocaleDateString();
                
                // Generate labels HTML
                const labelsHtml = pr.labels && pr.labels.length > 0 
                    ? `<div class="pr-labels">${pr.labels.map(label => {
                        // Calculate text color based on background
                        const rgb = parseInt(label.color, 16);
                        const r = (rgb >> 16) & 0xff;
                        const g = (rgb >> 8) & 0xff;
                        const b = rgb & 0xff;
                        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                        const textColor = brightness > 128 ? '#000' : '#fff';
                        
                        return `<span class="pr-label" style="background: #${label.color}; color: ${textColor}">${label.name}</span>`;
                    }).join('')}</div>`
                    : '';
                
                return `
                    <div class="pr-card">
                        <div class="pr-header">
                            <div class="pr-title">
                                <a href="${pr.html_url}" target="_blank">#${pr.number}: ${pr.title}</a>
                            </div>
                            <div class="pr-status ${statusClass}">${statusText}</div>
                        </div>
                        <div class="pr-meta">
                            by ${pr.user.login} • Created: ${created} • Updated: ${updated}
                        </div>
                        ${labelsHtml}
                    </div>
                `;
            }).join('');
        }
        
        // Initialize on page load
        console.log('Dashboard loaded - Click Refresh Now to fetch PRs');
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Proto API PR Dashboard</title>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/images/proto_logo.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .proto-logo {
            width: 40px;
            height: 40px;
        }
        h1 {
            color: #FF6B35;
            font-size: 28px;
            margin: 0;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .refresh-btn {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background: #FF8C42;
        }
        .timer {
            color: #FF6B35;
            font-family: monospace;
            padding: 8px 12px;
            border: 1px solid #FF6B35;
            border-radius: 4px;
            background: rgba(255,107,53,0.1);
        }
        .filters {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-input {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 10px 14px;
            border-radius: 6px;
            width: 200px;
        }
        .filter-input:focus {
            outline: none;
            border-color: #FF6B35;
        }
        .stats {
            margin-left: auto;
            padding: 10px 16px;
            background: rgba(255,107,53,0.1);
            border: 1px solid #FF6B35;
            border-radius: 6px;
            display: flex;
            gap: 20px;
            font-size: 13px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .pr-card {
            background: linear-gradient(135deg, #0a0a0a, #111);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 14px;
            transition: all 0.3s;
        }
        .pr-card:hover {
            border-color: #FF6B35;
            transform: translateX(2px);
        }
        .pr-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .pr-title a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        .pr-title a:hover {
            color: #FF6B35;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
        }
        .open { background: #2ea44f; }
        .closed { background: #cb2431; }
        .merged { background: #6f42c1; }
        .pr-meta {
            color: #999;
            font-size: 13px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-section">
                <img src="assets/images/proto_logo.png" alt="Proto" class="proto-logo">
                <h1>Proto API PR Dashboard</h1>
            </div>
            <div class="controls">
                <button class="refresh-btn" onclick="loadPRs()">Refresh</button>
                <div class="timer" id="timer">15:00</div>
            </div>
        </div>
        
        <div class="filters">
            <input type="text" id="author" class="filter-input" placeholder="Filter by author" onkeyup="applyFilters()">
            <input type="text" id="title" class="filter-input" placeholder="Filter by title" onkeyup="applyFilters()">
            <select id="status" class="filter-input" onchange="applyFilters()">
                <option value="">All PRs</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="merged">Merged</option>
            </select>
            <div class="stats">
                <div class="stat">
                    <span class="dot" style="background:#2ea44f"></span>
                    <span id="open-stat">Open: 0%</span>
                </div>
                <div class="stat">
                    <span class="dot" style="background:#cb2431"></span>
                    <span id="closed-stat">Closed: 0%</span>
                </div>
                <div class="stat">
                    <span class="dot" style="background:#6f42c1"></span>
                    <span id="merged-stat">Merged: 0%</span>
                </div>
            </div>
        </div>
        
        <div id="prs">
            <div class="loading">Loading pull requests...</div>
        </div>
    </div>

    <script>
        console.log('Dashboard starting...');
        
        let allPRs = [];
        let timerInterval;
        let timeLeft = 900; // 15 minutes in seconds
        
        function updateTimer() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer').textContent = 
                mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
            
            if (timeLeft <= 0) {
                loadPRs();
                timeLeft = 900;
            } else {
                timeLeft--;
            }
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 900;
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        function loadPRs() {
            console.log('Loading PRs...');
            const container = document.getElementById('prs');
            container.innerHTML = '<div class="loading">Loading pull requests...</div>';
            
            // Token should be stored securely, not in code
            // For production, use environment variables or secure storage
            const token = prompt('Please enter your GitHub token:') || '';
            
            fetch('https://api.github.com/repos/btc-mining/miner-firmware/pulls?state=all&base=main&sort=updated&direction=desc&per_page=100', {
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(r => {
                console.log('Response status:', r.status);
                return r.json();
            })
            .then(data => {
                console.log('Loaded', data.length, 'PRs');
                allPRs = data;
                updateStats();
                applyFilters();
                startTimer();
            })
            .catch(err => {
                console.error('Error:', err);
                container.innerHTML = '<div class="loading">Error loading PRs: ' + err.message + '</div>';
            });
        }
        
        function updateStats() {
            const total = allPRs.length;
            if (total === 0) return;
            
            const open = allPRs.filter(pr => pr.state === 'open').length;
            const closed = allPRs.filter(pr => pr.state === 'closed' && !pr.merged_at).length;
            const merged = allPRs.filter(pr => pr.merged_at).length;
            
            document.getElementById('open-stat').textContent = 'Open: ' + Math.round(open/total*100) + '%';
            document.getElementById('closed-stat').textContent = 'Closed: ' + Math.round(closed/total*100) + '%';
            document.getElementById('merged-stat').textContent = 'Merged: ' + Math.round(merged/total*100) + '%';
        }
        
        function applyFilters() {
            const author = document.getElementById('author').value.toLowerCase();
            const title = document.getElementById('title').value.toLowerCase();
            const status = document.getElementById('status').value;
            
            let filtered = allPRs.filter(pr => {
                if (author && !pr.user.login.toLowerCase().includes(author)) return false;
                if (title && !pr.title.toLowerCase().includes(title)) return false;
                if (status) {
                    if (status === 'open' && pr.state !== 'open') return false;
                    if (status === 'closed' && (pr.state !== 'closed' || pr.merged_at)) return false;
                    if (status === 'merged' && !pr.merged_at) return false;
                }
                return true;
            });
            
            displayPRs(filtered);
        }
        
        function displayPRs(prs) {
            const container = document.getElementById('prs');
            
            if (prs.length === 0) {
                container.innerHTML = '<div class="loading">No pull requests found</div>';
                return;
            }
            
            container.innerHTML = prs.map(pr => {
                let status = 'open';
                let statusText = 'Open';
                if (pr.merged_at) {
                    status = 'merged';
                    statusText = 'Merged';
                } else if (pr.state === 'closed') {
                    status = 'closed';
                    statusText = 'Closed';
                }
                
                return '<div class="pr-card">' +
                    '<div class="pr-header">' +
                    '<div class="pr-title">' +
                    '<a href="' + pr.html_url + '" target="_blank">#' + pr.number + ': ' + pr.title + '</a>' +
                    '</div>' +
                    '<span class="status-badge ' + status + '">' + statusText + '</span>' +
                    '</div>' +
                    '<div class="pr-meta">' +
                    'by ' + pr.user.login + ' • Created: ' + new Date(pr.created_at).toLocaleDateString() +
                    ' • Updated: ' + new Date(pr.updated_at).toLocaleDateString() +
                    '</div>' +
                    '</div>';
            }).join('');
        }
        
        // Load on start
        console.log('Starting initial load...');
        loadPRs();
    </script>
</body>
</html>
